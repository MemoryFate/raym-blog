<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/src/assets/vue.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <title>RayM Blog</title>
    </head>
    <body>
        <div id="app"></div>
        <!-- The inline recovery hook also works if the main JS entry itself returns 404. -->
        <script>
            (function () {
                var key = "raym:asset-recovery-v1";
                var timeout = 120000;

                window.addEventListener("error", function (event) {
                    var target = event.target;
                    if (!target || target.tagName !== "SCRIPT" || target.type !== "module") return;

                    var last = 0;
                    try { last = Number(sessionStorage.getItem(key) || 0); } catch (ignored) {}

                    if (Date.now() - last >= timeout) {
                        try {
                            sessionStorage.setItem(key, String(Date.now()));
                            var url = new URL(location.href);
                            url.searchParams.set("__raym_recover", String(Date.now()));
                            location.replace(url.toString());
                            return;
                        } catch (ignored) {}
                    }

                    if (document.getElementById("raym-bootstrap-notice")) return;
                    var notice = document.createElement("div");
                    notice.id = "raym-bootstrap-notice";
                    notice.setAttribute("role", "alert");
                    notice.style.cssText = "position:fixed;left:50%;top:28%;transform:translateX(-50%);z-index:99999;max-width:min(420px,calc(100vw - 32px));padding:24px;border:1px solid #58bceb;border-radius:16px;background:#0b151d;color:#eaf6ff;box-shadow:0 20px 55px rgba(0,0,0,.4);font:14px/1.7 system-ui,sans-serif;";
                    var title = document.createElement("strong");
                    title.textContent = "网站资源加载失败";
                    title.style.cssText = "display:block;margin-bottom:8px;font-size:17px;";
                    var details = document.createElement("p");
                    details.textContent = "网站可能刚刚更新，请重新载入最新版本。如果持续失败，请稍后重试。";
                    details.style.cssText = "margin:0 0 14px;color:#b7c8dc;";
                    var retry = document.createElement("button");
                    retry.textContent = "重新加载";
                    retry.type = "button";
                    retry.style.cssText = "padding:9px 15px;border:0;border-radius:8px;background:#78cff6;color:#041018;font-weight:600;cursor:pointer;";
                    retry.addEventListener("click", function () {
                        try { sessionStorage.removeItem(key); } catch (ignored) {}
                        var next = new URL(location.href);
                        next.searchParams.set("__raym_recover", String(Date.now()));
                        location.replace(next.toString());
                    });
                    notice.append(title, details, retry);
                    document.body.appendChild(notice);
                }, true);
            })();
        </script>
        <script type="module" src="/src/main.js"></script>
    </body>
    <style>
    </style>
</html>
